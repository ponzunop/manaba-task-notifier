# Server (default loopback binding; override with SERVER_ADDRESS=0.0.0.0 if needed)
server.port=8080
server.address=${SERVER_ADDRESS:127.0.0.1}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

# Application
spring.application.name=manaba-notifier

# H2 Database (File-based persistence)
spring.datasource.url=jdbc:h2:file:./data/manabadb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (disabled for security - prevents unauthenticated SQL access)
spring.h2.console.enabled=false

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
