# Server (default loopback binding for local dev; cloud/Docker sets SERVER_ADDRESS=0.0.0.0 and PORT)
server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}
server.forward-headers-strategy=framework
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

# Application
spring.application.name=manaba-notifier
app.gas.shared-url=${SHARED_GAS_URL:}
app.public-mode=${APP_PUBLIC_MODE:false}

# Database (Defaults to local H2 file DB; override with SPRING_DATASOURCE_URL for PostgreSQL in cloud)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/manabadb;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# H2 Console (disabled for security - prevents unauthenticated SQL access)
spring.h2.console.enabled=false

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
